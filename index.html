<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madeline Beebe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        /* Darkened Teal to almost Navy */
                        medNavyTeal: '#0d1b2a', 
                        medIce: '#B9D6E5',
                        medPlum: '#4E3A53',
                        medOlive: '#698F3D',
                        medPistachio: '#D6E685',
                        medRose: '#D06D9C',
                        medCream: '#F5EDB9',
                        medWood: '#3e2723',
                        medSlate: '#868884'
                    },
                    fontFamily: { medieval: ['"MedievalSharp"', 'cursive'] }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'MedievalSharp', cursive; 
            margin: 0;
            overflow: hidden; /* Prevents scrolling, locking it as a single scene */
            background-color: #0d1b2a;
        }

        /* Magical Glows */
        .glow-pistachio { text-shadow: 0 0 10px rgba(214, 230, 133, 0.8); }
        .glow-rose { text-shadow: 0 0 10px rgba(208, 109, 156, 0.8); box-shadow: 0 0 15px rgba(208, 109, 156, 0.6); }
        .glow-ice { text-shadow: 0 0 10px rgba(185, 214, 229, 0.8); }
        
        .pixelated { image-rendering: pixelated; image-rendering: crisp-edges; }
        
        /* 3D Room CSS Setup */
        .room-wall {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 70%;
            background: linear-gradient(to bottom, #0d1b2a, #1a2f3a);
            border-bottom: 6px solid #15242b;
            z-index: 1;
        }
        .room-floor {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 30%;
            background: linear-gradient(to bottom, #3e2723, #251613);
            z-index: 1;
            /* Simple CSS perspective to look like a floor */
            box-shadow: inset 0 20px 30px rgba(0,0,0,0.5);
        }

        /* Interactive Room Objects */
        .room-object {
            position: absolute;
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            display: flex;
            flex-col;
            align-items: center;
        }
        .room-object:hover {
            transform: scale(1.15) translateY(-5px);
            filter: drop-shadow(0 0 15px rgba(214,230,133,0.6));
        }
        .room-object span {
            opacity: 0;
            transition: opacity 0.3s;
            margin-top: 8px;
            background-color: rgba(13, 27, 42, 0.8);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #D6E685;
            white-space: nowrap;
            pointer-events: none;
        }
        .room-object:hover span {
            opacity: 1;
        }

        /* Pouch Pulse Animation */
        @keyframes goldPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 rgba(214,230,133,0); }
            50% { transform: scale(1.15); box-shadow: 0 0 20px rgba(214,230,133,1); }
            100% { transform: scale(1); box-shadow: 0 0 0 rgba(214,230,133,0); }
        }
        .animate-pulse-gold { animation: goldPulse 0.5s ease-out; }
    </style>
</head>
<body class="text-medCream" onload="initDashboard()">

    <!-- PERSISTENT TOP LEFT NAME -->
    <div class="fixed top-6 left-6 z-50 text-3xl text-medCream glow-ice pointer-events-none tracking-widest">
        Madeline Beebe
    </div>

    <!-- GAMIFICATION: Coin Pouch -->
    <div id="pouch" class="fixed top-6 right-6 bg-medWood border-2 border-medPistachio text-medPistachio px-4 py-2 rounded-xl z-50 shadow-lg flex items-center gap-2 text-2xl cursor-default">
        <span>🪙</span> <span id="coin-count" class="glow-pistachio">0</span>
    </div>

    <!-- 2D ISOMETRIC ROOM (THE STUDY) -->
    <div class="w-full h-screen relative">
        
        <!-- Environment Architecture -->
        <div class="room-wall"></div>
        <div class="room-floor"></div>

        <!-- ========================================== -->
        <!-- FOCAL POINT: AVATAR & PERSONA BOX          -->
        <!-- ========================================== -->
        <div class="absolute left-1/2 bottom-[15%] -translate-x-1/2 z-30 flex flex-col items-center">
            
            <!-- Persona Box (Floating Nameplate) -->
            <div class="bg-medPlum/90 border-2 border-medPistachio p-4 rounded-xl shadow-2xl mb-8 w-80 text-center relative z-40 transform hover:scale-105 transition-transform cursor-default">
                <h1 class="text-2xl text-medPistachio glow-pistachio mb-2">Magister Madeline Beebe</h1>
                <div class="grid grid-cols-2 gap-2 text-sm text-medCream text-left px-2">
                    <p><span class="text-medIce">Class:</span> Scholar</p>
                    <p><span class="text-medIce">Rank:</span> Magister</p>
                    <p class="col-span-2"><span class="text-medIce">Materia:</span> Cosmonautics & Analytics</p>
                </div>
            </div>

            <!-- Giant Avatar -->
            <div class="relative w-56 h-56 flex justify-center">
                <!-- Drop your new avatar PNG here -->
                <img src="assets/avatars/Main_Avatar.png" alt="Avatar" class="w-full h-full object-contain pixelated drop-shadow-[0_15px_15px_rgba(0,0,0,0.8)]">
                
                <!-- Level Badge (Rounded Box touching head) -->
                <div class="absolute -top-4 right-8 bg-medRose text-medCream border-2 border-medCream rounded-md px-3 py-1 text-xl font-bold glow-rose z-50">
                    LVL 5
                </div>
            </div>

        </div>

        <!-- ========================================== -->
        <!-- THE ENVIRONMENT OBJECTS (NAVIGATION)       -->
        <!-- ========================================== -->

        <!-- Overworld Map (Pinned to left wall) -->
        <a href="map.html" class="room-object flex-col" style="top: 25%; left: 15%;">
            <img src="assets/ui/WoodTable.png" class="w-20 h-20 pixelated drop-shadow-xl">
            <span class="text-medPistachio">Overworld Map</span>
        </a>

        <!-- The Academy (Banner hanging on wall) -->
        <a href="academy.html" class="room-object flex-col" style="top: 15%; left: 35%;">
            <img src="assets/buildings/Castle.png" class="w-24 h-24 pixelated drop-shadow-xl">
            <span class="text-medPistachio">The Academy</span>
        </a>

        <!-- Campaign Log (Book on the floor right) -->
        <a href="campaign.html" class="room-object flex-col" style="bottom: 20%; right: 28%;">
            <img src="assets/ui/SpecialPaper.png" class="w-20 h-20 pixelated drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)]">
            <span class="text-medPistachio">Campaign Log</span>
        </a>

        <!-- Inventory (Chest on the floor left) -->
        <a href="inventory.html" class="room-object flex-col" style="bottom: 12%; left: 22%;">
            <img src="assets/icons/Icon_06.png" class="w-20 h-20 pixelated drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)]">
            <span class="text-medPistachio">Artifact Inventory</span>
        </a>

        <!-- Skill Tree (Glowing Crystal/Bookshelf upper right) -->
        <a href="skills.html" class="room-object flex-col" style="top: 30%; right: 18%;">
            <img src="assets/icons/Icon_11.png" class="w-16 h-16 pixelated drop-shadow-xl animate-pulse">
            <span class="text-medPistachio">Skill Tree</span>
        </a>

        <!-- Side Quests (Notice Board middle right) -->
        <a href="sidequests.html" class="room-object flex-col" style="top: 55%; right: 10%;">
            <img src="assets/icons/Icon_08.png" class="w-20 h-20 pixelated drop-shadow-xl">
            <span class="text-medPistachio">Side Quests</span>
        </a>

        <!-- ========================================== -->
        <!-- THE DRIVING DIRECTIVE                      -->
        <!-- ========================================== -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-50 text-center w-full pointer-events-none">
            <p class="text-medPistachio text-xl tracking-widest glow-pistachio">
                driving directive: leverage skills to become a realm force for good.
            </p>
        </div>

        <!-- GAMIFICATION COIN -->
        <button id="hidden-coin" onclick="collectCoin(event, this)" class="absolute text-5xl opacity-0 hover:opacity-100 transition-all z-[100]" title="A hidden coin!">
            🪙
        </button>

    </div>

    <script>
        // --- 1. Coin Gamification & Random Spawn Logic ---
        function initDashboard() {
            // Load coins from storage
            let coins = localStorage.getItem('agencia_coins') || 0;
            document.getElementById('coin-count').innerText = coins;

            // Define possible hidden locations for the coin
            const spawnPoints = [
                { top: '15%', left: '8%' },
                { top: '75%', right: '15%' },
                { top: '40%', left: '80%' },
                { bottom: '15%', left: '10%' },
                { top: '25%', left: '60%' },
                { top: '60%', left: '25%' }
            ];

            // Pick a random location and apply it to the coin
            const coin = document.getElementById('hidden-coin');
            const randomSpawn = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
            
            // Apply the coordinates
            if (randomSpawn.top) coin.style.top = randomSpawn.top;
            if (randomSpawn.bottom) coin.style.bottom = randomSpawn.bottom;
            if (randomSpawn.left) coin.style.left = randomSpawn.left;
            if (randomSpawn.right) coin.style.right = randomSpawn.right;
        }

        // --- 2. Coin Flight Animation ---
        function collectCoin(event, element) {
            const pouch = document.getElementById('pouch');
            
            // Create a ghost coin for the flight animation
            const ghostCoin = document.createElement('div');
            ghostCoin.innerText = '🪙';
            ghostCoin.style.position = 'fixed';
            ghostCoin.style.left = event.clientX + 'px';
            ghostCoin.style.top = event.clientY + 'px';
            ghostCoin.style.fontSize = '3rem';
            ghostCoin.style.zIndex = '9999';
            ghostCoin.style.pointerEvents = 'none';
            // Easing gives it a nice physical arc feel
            ghostCoin.style.transition = 'all 0.7s cubic-bezier(0.25, 1, 0.5, 1)'; 
            document.body.appendChild(ghostCoin);
            
            // Hide the original coin immediately
            element.style.display = 'none';

            // Trigger the flight to the pouch
            setTimeout(() => {
                const pouchRect = pouch.getBoundingClientRect();
                ghostCoin.style.left = (pouchRect.left + 20) + 'px';
                ghostCoin.style.top = (pouchRect.top + 10) + 'px';
                ghostCoin.style.transform = 'scale(0.5)';
                ghostCoin.style.opacity = '0';
            }, 20);

            // Complete the collection
            setTimeout(() => {
                ghostCoin.remove();
                
                // Update Local Storage
                let coins = parseInt(localStorage.getItem('agencia_coins') || 0) + 1;
                localStorage.setItem('agencia_coins', coins);
                document.getElementById('coin-count').innerText = coins;
                
                // Flash the pouch
                pouch.classList.add('animate-pulse-gold');
                setTimeout(() => pouch.classList.remove('animate-pulse-gold'), 500);
            }, 720);
        }
    </script>
</body>
</html>
