<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | Cosmonautia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { medTeal: '#24555A', medIce: '#B9D6E5', medPlum: '#4E3A53', medOlive: '#698F3D', medPistachio: '#D6E685', medRose: '#D06D9C', medCream: '#F5EDB9', medWood: '#3e2723' } },
                fontFamily: { medieval: ['"MedievalSharp"', 'cursive'] }
            }
        }
    </script>
    <style>
        body { font-family: 'MedievalSharp', cursive; }
        .shelf-wood { background-color: #4A3728; border-bottom: 12px solid #2d2118; border-top: 2px solid #6b533f; box-shadow: 0 15px 25px rgba(0,0,0,0.5); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .floating { animation: float 4s ease-in-out infinite; }
    </style>
</head>
<body class="bg-medPlum text-medCream min-h-screen p-3 md:p-6">

    <div class="max-w-5xl mx-auto border-4 border-medTeal bg-medTeal/40 rounded-3xl p-6 md:p-12 shadow-2xl relative min-h-[80vh]">
        <a href="index.html" class="text-medIce hover:text-medPistachio mb-6 inline-block">← Return to Dashboard</a>
        
        <h1 class="text-4xl text-medPistachio border-b-2 border-medIce/40 pb-4 mb-16 text-center">Realm Inventory</h1>
        
        <!-- ARTIFACTS SHELF -->
        <div class="mb-24">
            <h2 class="text-2xl text-medRose mb-8 text-center">Secured Artifacts</h2>
            <div class="w-full h-4 shelf-wood relative rounded-sm max-w-3xl mx-auto">
                <div class="absolute bottom-4 w-full flex justify-around items-end px-4">
                    <div class="floating text-center">
                        <div class="text-4xl mb-2">🛡️</div>
                        <span class="text-xs bg-medPlum/80 px-2 py-1 rounded">TWINspect</span>
                    </div>
                    <div class="floating" style="animation-delay: 1s;">
                        <div class="text-4xl mb-2">📜</div>
                        <span class="text-xs bg-medPlum/80 px-2 py-1 rounded">Commuter Codex</span>
                    </div>
                    <div class="floating" style="animation-delay: 2s;">
                        <div class="text-4xl mb-2">🔮</div>
                        <span class="text-xs bg-medPlum/80 px-2 py-1 rounded">Symphonic Crystal</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- MAPS SHELF -->
        <div>
            <h2 class="text-2xl text-medIce mb-8 text-center">Maps of Other "Realms"</h2>
            <p class="text-center text-medCream/70 mb-12 text-sm italic">Different paths or industries I might go into...</p>
            
            <div class="w-full h-4 shelf-wood relative rounded-sm max-w-3xl mx-auto">
                <div class="absolute bottom-4 w-full flex justify-around items-end px-4">
                    <div class="floating text-center">
                        <div class="text-4xl mb-2">🗺️</div>
                        <span class="text-xs text-medPistachio bg-medPlum/80 px-2 py-1 rounded">The Academy Map</span>
                    </div>
                    <div class="floating" style="animation-delay: 1.5s;">
                        <div class="text-4xl mb-2">🌌</div>
                        <span class="text-xs text-medPistachio bg-medPlum/80 px-2 py-1 rounded">Cosmos Map</span>
                        <p class="text-[10px] text-medIce/60 mt-1 absolute w-32 -left-8">(Unique to the stars locations at the time / place of viewer)</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
